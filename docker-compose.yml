services:
  db:
    image: mysql:8.0
    container_name: cleanlondon_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootsecretpassword
      MYSQL_DATABASE: cleanlondon_db
      MYSQL_USER: cleanlondon_user
      MYSQL_PASSWORD: cleanlondon_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecretpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - cleanlondon_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cleanlondon_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=cleanlondon_user
      - DB_PASSWORD=cleanlondon_pass
      - DB_NAME=cleanlondon_db
      - JWT_SECRET_KEY=supersecretjwtkey_cleanlondon_production_grade_token_2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - GOOGLE_CLIENT_ID=mock-google-client-id.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=mock-google-client-secret
      - GOOGLE_MAPS_API_KEY=MOCK_GOOGLE_MAPS_KEY_LONDON
      - MOCK_MODE=true
      - STRIPE_SECRET_KEY=sk_test_mockCleanLondonKey2026
      - STRIPE_PUBLISHABLE_KEY=pk_test_mockCleanLondonPubKey2026
      - STRIPE_WEBHOOK_SECRET=whsec_mockWebhookSecret2026
      - STRIPE_SUCCESS_URL=http://localhost:8000/static/success.html?session_id={CHECKOUT_SESSION_ID}
      - STRIPE_CANCEL_URL=http://localhost:8000/static/cancel.html
    volumes:
      - .:/app
    networks:
      - cleanlondon_net

volumes:
  mysql_data:
    driver: local

networks:
  cleanlondon_net:
    driver: bridge
